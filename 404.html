<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      const path = window.location.pathname + window.location.search + window.location.hash;
      const base = "/";
      sessionStorage.redirect = path;
      window.location.replace(base);
    </script>
  </head>
  <body></body>
</html>
